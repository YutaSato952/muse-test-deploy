<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muse テストデプロイ</title>
<style>
  body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  p { color: #94a3b8; line-height: 1.8; }
  .badge { display: inline-block; padding: 0.25rem 0.9rem; border: 1px solid #38bdf8; border-radius: 999px; color: #38bdf8; margin-bottom: 1rem; }
  #now { color: #38bdf8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="badge">TEST DEPLOY</div>
  <h1>デプロイ成功です</h1>
  <p>このページは Muse が作成し、無料ホスティングへ公開したテストページです。<br>
  現在時刻（日本時間）: <span id="now">--</span></p>
</main>
<script>
  function tick() {
    document.getElementById('now').textContent =
      new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
